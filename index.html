<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Ironman Workout Tracker</title>
    <link rel="apple-touch-icon" href="image/180.png" sizes="180x180">
    <link rel="apple-touch-icon" href="image/167.png" sizes="167x167"> <!-- iPad Pro -->
    <link rel="apple-touch-icon" href="image/152.png" sizes="152x152"> <!-- Older iPads -->
    <link rel="apple-touch-icon" href="image/120.png" sizes="120x120"> <!-- Older iPhones -->
    <!-- Pinned versions: keep these in sync with CDN_FILES in sw.js -->
    <script src="https://unpkg.com/lucide@1.67.0/dist/umd/lucide.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <header class="app-header">
        <button class="brand" onclick="playEasterEgg()" aria-label="Iron Man">
            <img src="image/reactor.png" alt="" class="reactor">
            <img src="logo.png" alt="Iron Man" class="wordmark">
        </button>
        <span class="header-divider"></span>
        <span class="header-subtitle">Workout Tracker</span>
    </header>

    <!-- VIEW: HOME (WORKOUTS) -->
    <main id="view-home" class="view">
        <div class="page-head">
            <h1 class="page-title">Workouts</h1>
            <button class="btn btn-red btn-small" onclick="openWorkoutModal()">
                <i data-lucide="plus"></i>New Workout</button>
        </div>
        <div id="workoutList" class="list"></div>
    </main>

    <!-- VIEW: LOGGER -->
    <main id="view-log" class="view view-log hidden">
        <div class="log-head">
            <button class="back-btn" onclick="showView('home')" aria-label="Back"><i data-lucide="chevron-left"></i></button>
            <h1 id="logWorkoutName" class="page-title"></h1>
        </div>
        <div id="movementLogs" class="list"></div>
        <button class="btn btn-red btn-finish" onclick="finishSession()">Finish &amp; Save</button>
        <p class="credit">An IFNS Project</p>
    </main>

    <!-- VIEW: HISTORY -->
    <main id="view-stats" class="view hidden">
        <div class="page-head">
            <h1 class="page-title">History</h1>
            <span id="historyCount" class="count-pill">0 logs</span>
        </div>
        <div id="historyList" class="list"></div>
    </main>

    <!-- VIEW: PROGRESS PICTURES -->
    <main id="view-progress" class="view hidden">
        <div class="page-head">
            <h1 class="page-title">Progress</h1>
            <button class="btn btn-red btn-small" onclick="openPhotoUpload()">
                <i data-lucide="plus"></i>Add Photo</button>
        </div>
        <div id="progressList" class="list"></div>
    </main>

    <!-- SHEET: WORKOUT EDITOR -->
    <div id="modal-workout" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="grabber"></div>
            <h2 id="modalTitle" class="sheet-title">New Workout</h2>
            <label class="field-label" for="workoutNameInput">Workout name</label>
            <input type="text" id="workoutNameInput" class="text-field" placeholder="e.g. Push">
            <div class="field-label">Movements</div>
            <div id="movementInputsContainer" class="movement-rows"></div>
            <button class="btn btn-gold" onclick="addMovementRow()"><i data-lucide="plus"></i>Add Movement</button>
            <div class="sheet-actions">
                <button class="btn btn-grey" onclick="closeWorkoutModal()">Cancel</button>
                <button class="btn btn-red" onclick="handleWorkoutSave()">Save</button>
            </div>
        </div>
    </div>

    <!-- SHEET: PHOTO UPLOAD -->
    <div id="modal-photo-upload" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="grabber"></div>
            <h2 class="sheet-title">Add Progress Photo</h2>
            <label class="field-label" for="photoDateInput">Date</label>
            <div class="date-field">
                <input type="date" id="photoDateInput" class="text-field">
                <i data-lucide="calendar"></i>
            </div>
            <div class="field-label">Photo</div>
            <div id="photoPreviewContainer" class="photo-preview hidden">
                <img id="photoPreview" alt="">
            </div>
            <label class="btn btn-gold">
                <i data-lucide="camera"></i>Choose Photo
                <input type="file" id="photoFileInput" accept="image/*" class="hidden" onchange="previewPhoto(this)">
            </label>
            <div class="sheet-actions">
                <button class="btn btn-grey" onclick="closePhotoUpload()">Cancel</button>
                <button class="btn btn-red" onclick="saveProgressPhoto()">Save</button>
            </div>
        </div>
    </div>

    <!-- PHOTO VIEWER -->
    <div id="modal-photo-viewer" class="viewer hidden" onclick="closePhotoViewer()">
        <button class="viewer-close" onclick="event.stopPropagation(); closePhotoViewer()" aria-label="Close">
            <i data-lucide="x"></i>
        </button>
        <div class="viewer-stage">
            <button id="viewer-prev" class="viewer-arrow" onclick="event.stopPropagation(); navigatePhoto(-1)" aria-label="Previous photo">
                <i data-lucide="chevron-left"></i>
            </button>
            <div id="photo-swipe-container" class="viewer-frame" onclick="event.stopPropagation()">
                <img id="viewerPhoto" class="viewer-photo" alt="">
            </div>
            <button id="viewer-next" class="viewer-arrow" onclick="event.stopPropagation(); navigatePhoto(1)" aria-label="Next photo">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>
        <p id="viewerDate" class="viewer-date"></p>
        <p id="viewerCounter" class="viewer-counter"></p>
    </div>

    <!-- BOTTOM BAR: tabs + credit -->
    <div id="bottom-bar" class="bottom-bar">
        <nav id="main-nav" class="tabbar">
            <button onclick="showView('home')" id="nav-home" class="tab is-active">
                <svg class="icon-barbell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12h2M20 12h2M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10" />
                </svg>
                <span>Workouts</span>
            </button>
            <button onclick="showView('progress')" id="nav-progress" class="tab">
                <i data-lucide="camera"></i><span>Progress</span>
            </button>
            <button onclick="showView('stats')" id="nav-stats" class="tab">
                <i data-lucide="clock"></i><span>History</span>
            </button>
        </nav>
        <footer class="credit">An IFNS Project</footer>
    </div>

    <script src="script.js"></script>
    <script>
        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registered:', reg.scope))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
